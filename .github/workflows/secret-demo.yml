
name: GitHub Secrets Demo

on:
  push:
  workflow_dispatch:

jobs:
  test-secret:
    runs-on: ubuntu-latest

    steps:
      - name: Access GitHub Secret
        env:
          MY_SECRET: ${{ secrets.MY_SECRET }}
        run: |
          if [ -n "$MY_SECRET" ]; then
            echo "Success! GitHub Secret accessed securely."
          else
            echo "Secret is missing!"
            exit 1
          fi
